<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keyboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
   <div class="container">
    <h1>KEYBOARD</h1>
    <div class="keyboard-layout">
        

        <!-- Row 1-->
        <div class="row1">
           <div class="row1-key">Esc</div>
           <div class="row1-key">F1</div>
           <div class="row1-key">F2</div>
           <div class="row1-key">F3</div>
           <div class="row1-key">F4</div>
           <div class="row1-key">F5</div>
           <div class="row1-key">F6</div>
           <div class="row1-key">F7</div>
           <div class="row1-key">F8</div>
           <div class="row1-key">F9</div>
           <div class="row1-key">F10</div>
           <div class="row1-key">F11</div>
           <div class="row1-key">F12</div>
           <div class="row1-key">Pause</div>
           <div class="row1-key">Prt Sc</div>
           <div class="row1-key">Insert</div>
           <div class="row1-key">Delete</div>

       </div>

       <!-- Row 2-->

       <div class="row2">
           <div class="row2-key row1-key symbol">
               <div>~</div>
               <div>`</div>
              </div>
           <div class="row2-key row1-key symbol">
               <div>!</div>
               <div>1</div>
               </div>
           <div class="row2-key row1-key symbol">
               <div>@</div>
               <div>2</div>
           </div>
           <div class="row2-key row1-key symbol">
               <div>#</div>
               <div>3</div>
           </div>
           <div class="row2-key row1-key symbol">
               <div>$</div>
               <div>4</div>
           </div>
           <div class="row2-key row1-key symbol">
               <div>%</div>
               <div>5</div>
           </div>
           <div class="row2-key row1-key symbol">
               <div>^</div>
               <div>6</div>
           </div>
           <div class="row2-key row1-key symbol">
               <div>&</div>
               <div>7</div>
           </div>
           <div class="row2-key row1-key symbol">
               <div>*</div>
               <div>8</div>
           </div>
           <div class="row2-key row1-key symbol">
               <div>(</div>
               <div>9</div>
           </div>
           <div class="row2-key row1-key symbol">
               <div>)</div>
               <div>0</div>
           </div>
           <div class="row2-key row1-key symbol">
               <div>_</div>
               <div>-</div>
           </div>
           <div class="row2-key row1-key symbol">
               <div>+</div>
               <div>=</div>
           </div>
           <div  id="backspace" class="row2-key row1-key">Backspace</div>
           <div class="row2-key row1-key">Home</div>
       
       </div>

       <!-- Row 3-->

      <div class="row2">
        <div id="tab" class="row2-key row1-key">Tab</div>
        <div class="row2-key row1-key">Q</div>
        <div class="row2-key row1-key">W</div>
        <div class="row2-key row1-key">E</div>
        <div class="row2-key row1-key">R</div>
        <div class="row2-key row1-key">T</div>
        <div class="row2-key row1-key">Y</div>
        <div class="row2-key row1-key">U</div>
        <div class="row2-key row1-key">I</div>
        <div class="row2-key row1-key">O</div>
        <div class="row2-key row1-key">P</div>
        <div class="row2-key row1-key symbol">
            <div>{</div>
            <div>[</div>
        </div>
        <div class="row2-key row1-key symbol">
            <div>}</div>
            <div>]</div>
        </div>
        <div class="row2-key row1-key symbol">
            <div>|</div>
            <div>\</div>
        </div>
        <div class="row2-key row1-key">PgUp</div>
       
      </div>

      <!-- Row 4-->
      <div class="row2">
        <div id="capslock" class="row2-key row1-key">CapsLk</div>
        <div class="row2-key row1-key">A</div>
        <div class="row2-key row1-key">S</div>
        <div class="row2-key row1-key">D</div>
        <div class="row2-key row1-key">F</div>
        <div class="row2-key row1-key">G</div>
        <div class="row2-key row1-key">H</div>
        <div class="row2-key row1-key">J</div>
        <div class="row2-key row1-key">K</div>
        <div class="row2-key row1-key">L</div>
        <div class="row2-key row1-key symbol">
            <div>:</div>
            <div>;</div>
        </div>
        <div class="row2-key row1-key symbol">
            <div>"</div>
            <div>'</div>
        </div>
        <div id="enter" class="row2-key row1-key">Enter</div>
        <div class="row2-key row1-key">PgDn</div>

       </div>

       <!-- Row 5-->

      <div class="row2">
        <div id="shift-left" class="row2-key row1-key">Shift</div>
        <div class="row2-key row1-key">Z</div>
        <div class="row2-key row1-key">X</div>
        <div class="row2-key row1-key">C</div>
        <div class="row2-key row1-key">V</div>
        <div class="row2-key row1-key">B</div>
        <div class="row2-key row1-key">N</div>
        <div class="row2-key row1-key">M</div>
        <div class="row2-key row1-key symbol">
            <div> < </div>
            <div> , </div>
        </div>
        <div class="row2-key row1-key symbol"> 
            <div> > </div>
            <div> . </div>
        </div>
        <div class="row2-key row1-key symbol">
            <div>?</div>
            <div>/</div>
        </div>
        <div id="shift-right" class="row2-key row1-key">Shift</div>
        <div class="row2-key row1-key">End</div>
        
       
       
      </div>

       <!-- Row 6-->

      <div class="row2">
        <div class="row2-key row1-key">Ctrl</div>
        <div class=" row1-key row6-keys">Fn</div>
        <div class="row1-key row6-keys">
            <i class="fa-brands fa-windows"></i>
        </div>
        <div class=" row1-key row6-keys">Alt</div>
        <div id="space" class="row1-key">
            <i class="fa-solid fa-sun"></i>
        </div>
        <div class=" row1-key row6-keys">Alt</div>
        <div class="row1-key row6-keys">
            <i class="fa-solid fa-receipt"></i>
        </div>
        <div class="row2-key row1-key">Ctrl</div>
        <div class=" row1-key row6-keys"> 
            <i class="fa-sharp fa-solid fa-play fa-flip-horizontal"></i>
        </div>
        <div id="playback"> 
            <div class="playback-div"><i class="fa-sharp fa-solid fa-play fa-rotate-270"></i></div>
            <div class="playback-div"><i class="fa-sharp fa-solid fa-play fa-rotate-90"></i></div>
        </div>
        <div class=" row1-key row6-keys">
            <i class="fa-sharp fa-solid fa-play"></i>
        </div>
        
     </div>

    </div>
  </div>  


    
</body>
</html>
